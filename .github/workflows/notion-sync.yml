name: Nightly Notion Sync

on:
  schedule:
    - cron: '0 7 * * *'   # 7:00 UTC = 2:00 AM Eastern (EST)
  workflow_dispatch:       # adds a "Run workflow" button for manual syncs

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Pull LOD Matrix from Notion
        run: node sync-notion.js
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Nightly Notion sync" && git push)